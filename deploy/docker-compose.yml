x-server: &server
  image: ${PAPERBOAT_SERVER_IMAGE:?set PAPERBOAT_SERVER_IMAGE}
  env_file: ${PAPERBOAT_ENV_FILE:-.env}
  volumes:
    - ../config/catalogs.example.json:/app/config/catalogs.json:ro
    - ./secrets:/run/secrets:ro

services:
  migrate:
    <<: *server
    restart: "no"
    command: ["paperboat-server", "migrate"]

  seed-catalogs:
    <<: *server
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["paperboat-server", "seed-catalogs"]

  server:
    <<: *server
    restart: unless-stopped
    depends_on:
      seed-catalogs:
        condition: service_completed_successfully
    command: ["paperboat-server", "serve"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6

  caddy:
    image: caddy:2.11.4
    restart: unless-stopped
    environment:
      PAPERBOAT_CONTROL_DOMAIN: ${PAPERBOAT_CONTROL_DOMAIN:?set PAPERBOAT_CONTROL_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
