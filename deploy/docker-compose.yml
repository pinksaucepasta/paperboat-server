x-server: &server
  image: ${PAPERBOAT_SERVER_IMAGE:?set PAPERBOAT_SERVER_IMAGE}
  env_file: ${PAPERBOAT_ENV_FILE:-.env}
  environment:
    # This destination is an invariant of the parent mount below. Do not let
    # an older env file redirect the server to the parent directory.
    PAPERBOAT_RELEASE_DIRECTORY: /srv/paperboat-releases/current
  volumes:
    - ../config/catalogs.example.json:/app/config/catalogs.json:ro
    - ./secrets:/run/secrets:ro
    # Mount the releases parent, not its current child. The release publisher
    # atomically exchanges the current directory; binding the child itself
    # would pin the container to the old inode after activation.
    # PAPERBOAT_RELEASES_PATH remains a variable-name compatibility fallback,
    # but its value must also identify the parent directory.
    - ${PAPERBOAT_RELEASES_ROOT_PATH:-${PAPERBOAT_RELEASES_PATH:-/opt/paperboat/releases}}:/srv/paperboat-releases:ro

services:
  migrate:
    <<: *server
    restart: "no"
    command: ["paperboat-server", "migrate"]

  seed-catalogs:
    <<: *server
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["paperboat-server", "seed-catalogs"]

  server:
    <<: *server
    restart: unless-stopped
    depends_on:
      seed-catalogs:
        condition: service_completed_successfully
    command: ["paperboat-server", "serve"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6

  caddy:
    image: caddy:2.11.4
    restart: unless-stopped
    environment:
      PAPERBOAT_PUBLIC_BASE_URL: ${PAPERBOAT_PUBLIC_BASE_URL:?set PAPERBOAT_PUBLIC_BASE_URL}
      PAPERBOAT_RELEASE_BASE_URL: ${PAPERBOAT_RELEASE_BASE_URL:?set PAPERBOAT_RELEASE_BASE_URL}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
